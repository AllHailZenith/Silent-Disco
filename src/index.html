<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Silent Disco</title>
    <style>
        #danceFloor {
            width: 500px;
            height: 300px;
            background-color: black;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .panel {
            width: 100px;
            height: 100px;
            background-color: white;
        }

        #dancer {
            position: absolute;
            font-size: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>Silent Disco</h1>

<div id="danceFloor">
    <div class="panel" id="panel1"></div>
    <div class="panel" id="panel2"></div>
    <span id="dancer">🕺</span>
</div>

<script>
    function randomColor() {
        const red = Math.floor(Math.random() * 255);
        const green = Math.floor(Math.random() * 255);
        const blue = Math.floor(Math.random() * 255);

        return `rgb(${red}, ${green}, ${blue})`;
    }

    const panel1 = document.getElementById("panel1");
    const panel2 = document.getElementById("panel2");

    setInterval(() => {
        panel1.style.backgroundColor = randomColor();
        panel2.style.backgroundColor = randomColor();

        const danceFloor = document.getElementById("danceFloor");
        const dancer = document.getElementById("dancer");

        danceFloor.addEventListener("click", () => {
            danceFloor.style.backgroundColor = randomColor();
        });

        dancer.addEventListener("click", (event) => {
            event.stopPropagation();

            dancer.textContent = dancer.textContent === "🕺" ? "💃" : "🕺";
        });
    }, 1500);
</script>
</body>
</html>
